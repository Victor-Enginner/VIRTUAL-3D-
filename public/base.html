<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base do Mestre · Prospector</title>
<meta name="description" content="A base do criador, separada do escritório dos agentes.">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/sala.css">
<style>
  .resumo-base { z-index: 2; position: absolute; left: var(--esp-3); top: var(--esp-3); width: min(320px, calc(100% - 24px)); background: var(--vidro); border: 1px solid var(--linha); border-radius: var(--raio-bloco); padding: var(--esp-4); display: grid; gap: var(--esp-2); backdrop-filter: blur(6px); }
  @media (max-width: 640px) {
    .resumo-base:not(.aberto) > :not(h2):not(.essencial):not(.btn):not(.alternar) { display: none; }
    .resumo-base .alternar { justify-self: start; }
  }
  @media (min-width: 641px) { .resumo-base .alternar { display: none; } }
  @media (max-width: 640px) { .resumo-base { top: auto; bottom: var(--esp-3); left: var(--esp-3); right: var(--esp-3); width: auto; padding: var(--esp-3) var(--esp-4); } }
  .resumo-base { max-height: calc(100% - 24px); overflow: auto; }
  .resumo-base h3 { margin: var(--esp-2) 0 0; font-size: var(--t-13); }
  .regras { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--esp-2); }
  .regras li { display: grid; gap: 6px; padding: var(--esp-3); border: 1px solid var(--linha-suave); border-radius: var(--raio-controle); }
  .regras li small { color: var(--texto-3); font-size: var(--t-12); }
  .regras li div { display: flex; gap: var(--esp-2); }
  .estado { font-size: var(--t-12); padding: 1px 6px; border-radius: 6px; background: var(--superficie-3); color: var(--texto-2); margin-right: 4px; }
  .estado.e-ativa { color: var(--ok); } .estado.e-proposta { color: var(--acento-texto); }
  .vazio-regras { color: var(--texto-3) !important; }
  .resumo-base p { margin: 0; color: var(--texto-2); font-size: var(--t-13); }
  .resumo-base b { color: var(--texto); font-variant-numeric: tabular-nums; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<!-- prévia do link (WhatsApp, Instagram, LinkedIn, X): imagem em public/og.jpg, fonte em docs/producao/og/ -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Prospector">
<meta property="og:title" content="Prospector · Escritório Virtual 3D">
<meta property="og:description" content="Sua equipe de agentes de IA prospectando sozinha: acham empresas, auditam o site e escrevem a abordagem — num escritório 3D que você assiste trabalhar.">
<meta property="og:url" content="https://escritoriovirtual3d.netlify.app/base.html">
<meta property="og:image" content="https://escritoriovirtual3d.netlify.app/og.jpg">
<meta property="og:image:secure_url" content="https://escritoriovirtual3d.netlify.app/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Prospector: sua equipe de IA prospectando sozinha num escritório virtual 3D">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Prospector · Escritório Virtual 3D">
<meta name="twitter:description" content="Sua equipe de agentes de IA prospectando sozinha: acham empresas, auditam o site e escrevem a abordagem — num escritório 3D que você assiste trabalhar.">
<meta name="twitter:image" content="https://escritoriovirtual3d.netlify.app/og.jpg">
</head>
<body>
<div class="app">
  <aside class="lateral" id="lateral" aria-label="Navegação e equipe"></aside>
  <main class="principal sala">
    <header class="cabecalho">
      <button class="btn icone fantasma abrir-menu" data-abrir-menu aria-label="Abrir menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <div class="titulo"><h1>Base do Mestre</h1><p>Sua base, separada do escritório dos agentes.</p></div>
    </header>
    <div class="palco">
      <div id="cena" class="cena pronta" aria-label="Base do Mestre em 3D"></div>
      <p class="carregando" id="carregando" role="status">Carregando a base…</p>
      <section class="resumo-base" id="resumo" aria-live="polite"><p>Carregando…</p></section>
    </div>
  </main>
</div>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { carregarModelo, normalizar } from '/sala/modelos.js';
  import { carregarBase, criarPersonagem } from '/sala/personagens.js';
  import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
  import { montarShell, atualizarShell } from '/ui/shell.js';
  montarShell('base', { fundoNeural: false }); // a cena 3D já é o fundo
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const alvo = document.querySelector('#cena');
  const r = new THREE.WebGLRenderer({ antialias: true });
  r.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.shadowMap.enabled = true;
  alvo.appendChild(r.domElement);
  const cena = new THREE.Scene();
  cena.background = new THREE.Color(0x0c0c11);
  cena.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
  cena.environmentIntensity = 0.5;
  const sol = new THREE.DirectionalLight(0xfff1dc, 1.6);
  sol.position.set(4, 7, 5); sol.castShadow = true;
  cena.add(sol, new THREE.HemisphereLight(0xffffff, 0x3a3a48, 0.8));
  const cam = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  cam.position.set(5.2, 4.2, 5.6);
  const ctl = new OrbitControls(cam, r.domElement);
  ctl.target.set(0, 1, 0); ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI * 0.47; ctl.minDistance = 2; ctl.maxDistance = 14;
  new ResizeObserver(() => { r.setSize(alvo.clientWidth, alvo.clientHeight); cam.aspect = alvo.clientWidth / alvo.clientHeight; cam.updateProjectionMatrix();
    const k = Math.min(1.8, Math.max(1, 0.95 / cam.aspect)); const emPe = cam.aspect < 0.8;
    ctl.target.set(0, emPe ? 0.1 : 1, emPe ? 0.9 : 0); cam.position.set(5.2 * k, 4.2 * k + (emPe ? -0.9 : 0), 5.6 * k + (emPe ? 0.9 : 0)); }).observe(alvo); // em pé: afasta e sobe o cômodo na tela
  // rótulos HTML sobre a cena (mesmo estilo dos agentes da Sala 3D)
  const rotulos = new CSS2DRenderer();
  Object.assign(rotulos.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none' });
  alvo.appendChild(rotulos.domElement);
  new ResizeObserver(() => rotulos.setSize(alvo.clientWidth, alvo.clientHeight)).observe(alvo);

  // o Mestre (você) na cadeira da mesa: digita quando há mensagens esperando aprovação
  const ASSENTO = { x: -0.18, z: -0.66, rot: Math.PI, altura: 0.5 }; // medido no modelo da base (mesa em z ≈ -1,5)
  let mestre = null, rotuloMestre = null, elTarefa = null;
  const relogio = new THREE.Clock();
  carregarBase().then((base) => {
    const p = criarPersonagem(base, '#b7ff00');
    p.grupo.updateMatrixWorld(true);
    let quadril = null;
    p.raiz.traverse((o) => { if (!quadril && o.isBone && /Hips$/.test(o.name)) quadril = o; });
    const desce = quadril ? ASSENTO.altura - quadril.getWorldPosition(new THREE.Vector3()).y : 0;
    p.grupo.position.set(ASSENTO.x, desce, ASSENTO.z);
    p.grupo.rotation.y = ASSENTO.rot;
    cena.add(p.grupo);
    const el = document.createElement('div');
    el.className = 'rotulo';
    el.style.setProperty('--cor', '#b7ff00');
    el.innerHTML = '<div class="cartao"><strong><i></i>Você</strong><small>Mestre</small><div class="tarefa" id="tarefa-mestre">Na base</div></div>';
    elTarefa = el.querySelector('.tarefa');
    rotuloMestre = new CSS2DObject(el);
    rotuloMestre.position.set(0, 1.55, 0);
    p.grupo.add(rotuloMestre);
    mestre = p;
    atualizarMestre();
  }).catch((e) => console.warn('personagem não carregou:', e.message));
  let pendentes = 0;
  function atualizarMestre() {
    if (!mestre) return;
    mestre.tocar(pendentes ? 'digitando' : 'sentado');
    const t = elTarefa;
    if (t) t.textContent = pendentes ? `${pendentes} mensagem(ns) para aprovar` : 'Tudo em dia';
  }
  r.setAnimationLoop(() => { const dt = Math.min(relogio.getDelta(), 0.1); mestre?.mixer.update(dt); ctl.update(); r.render(cena, cam); rotulos.render(cena, cam); });
  window.__base = { THREE, cena, cam }; // inspeção pelo console
  carregarModelo('base-do-mestre').then((m) => { cena.add(normalizar(m, 'base-do-mestre')); document.querySelector('#carregando').hidden = true; })
    .catch((e) => { document.querySelector('#carregando').textContent = `A base não carregou: ${e.message}`; });

  // o que é seu: aprovações pendentes e o que os agentes aprenderam com você
  // TOCOMAS: o que o controlador segurou, fidelidade aos planos e leads que saíram da fila
  function tocomas(t, nomes = {}) {
    if (!t) return '';
    const ctrl = Object.values(t.controlador || {}).filter((d) => d.escolhida === 'esperar' || d.escolhida === 'parar_varredura');
    const f = t.fidelidade || { total: 0, preservados: 0 };
    return `${ctrl.map((d) => `<p>Controlador: ${esc(d.laco === 'varrer' ? 'varredura parada' : 'escrita em espera')} · ${esc(d.motivo)}</p>`).join('')}
      <p>Fidelidade aos planos: <b>${f.total ? Math.round((100 * f.preservados) / f.total) : 100}%</b> de ${f.total} job(s)${t.presos?.length ? ` · <b>${t.presos.length}</b> lead(s) fora da fila` : ''}</p>
      ${zonas(t.zonas, nomes)}`;
  }

  // B3: em que nichos a Nova já pode descartar sozinha (só com a calibração confiável)
  function zonas(z, nomes = {}) {
    if (!z?.nichos?.length) return '';
    const ligados = z.nichos.filter((n) => n.pronta);
    const falta = z.nichos.filter((n) => !n.pronta).map((n) => `${esc(nomes[n.nicho] || n.nicho)}: ${n.faltam ? `faltam ${n.faltam} decisões` : `erro ${n.ece} acima de ${z.limites.ece_max}`}`);
    return `<p>Decidir sozinha: ${ligados.length ? `<b>ligado</b> em ${ligados.map((n) => esc(nomes[n.nicho] || n.nicho)).join(', ')}` : '<b>desligado</b>'}${falta.length ? ` · ${falta.join(' · ')}` : ''}</p>`;
  }

  // meta-skills: o que os agentes propõem a partir dos seus descartes; nada vale sem você aceitar
  const BOTOES = { proposta: [['aceitar', 'Aceitar', 'primario'], ['recusar', 'Recusar', '']], ativa: [['desativar', 'Desativar', '']], revisada: [['reativar', 'Reativar', '']] };
  const ESTADO = { proposta: 'proposta', ativa: 'ativa', revisada: 'desativada' };
  function regras(lista) {
    if (!lista?.length) return '<p class="vazio-regras">Quando você descartar leads pelo mesmo motivo, os agentes propõem regras aqui.</p>';
    return `<h3>Regras aprendidas</h3><ul class="regras">${lista.map((h) => `<li>
      <p><span class="estado e-${h.estado}">${ESTADO[h.estado]}</span> Quando <b>${esc(h.quando)}</b> → ${esc(h.fornecer)}</p>
      <small>${h.evidencias.length} descarte(s) seu(s) como evidência${h.aplicada ? ` · aplicada ${h.aplicada}×` : ''}</small>
      <div>${(BOTOES[h.estado] || []).map(([a, r, c]) => `<button class="btn ${c}" data-regra="${esc(h.id)}" data-acao="${a}">${r}</button>`).join('')}</div></li>`).join('')}</ul>`;
  }
  let cartaoAberto = false; // no celular o cartão começa compacto para não cobrir o 3D
  document.querySelector('#resumo').addEventListener('click', (ev) => {
    if (!ev.target.closest('.alternar')) return;
    cartaoAberto = !cartaoAberto;
    resumo().catch(() => {});
  });
  document.querySelector('#resumo').addEventListener('click', async (ev) => {
    const b = ev.target.closest('[data-regra]');
    if (!b) return;
    b.setAttribute('aria-busy', 'true');
    await fetch(`/api/habilidades/${encodeURIComponent(b.dataset.regra)}/${b.dataset.acao}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
    resumo().catch(() => {});
  });

  async function resumo() {
    const [estado, { cabecas }, { habilidades }] = await Promise.all(['/api/estado', '/api/aprendizado', '/api/habilidades'].map((u) => fetch(u).then((x) => x.json())));
    atualizarShell(estado);
    const n = estado.funil?.mensagem || 0, b = estado.briefing || {};
    if (n !== pendentes) { pendentes = n; atualizarMestre(); }
    document.querySelector('#resumo').innerHTML = `<h2>Sua fila</h2>
      <p class="essencial"><b>${n}</b> mensagem(ns) esperando sua aprovação · <b>${b.responderam ?? 0}</b> responderam · <b>${b.enviados_hoje ?? 0}/${b.limite ?? 10}</b> envios hoje</p>
      <p>Os agentes aprenderam com <b>${cabecas.aprovacao.exemplos}</b> decisão(ões) suas.</p>
      ${tocomas(estado.tocomas, estado.nichos)}
      ${n ? `<a class="btn primario" href="/">Aprovar no Painel</a>` : ''}
      ${regras(habilidades)}
      <button class="btn fantasma alternar" aria-expanded="${cartaoAberto}">${cartaoAberto ? 'Menos detalhes' : 'Detalhes e regras'}</button>`;
    document.querySelector('#resumo').classList.toggle('aberto', cartaoAberto);
  }
  resumo().catch(() => {});
  setInterval(() => resumo().catch(() => {}), 5000);
</script>
</body>
</html>
