<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala 3D · Prospector</title>
<meta name="description" content="O escritório dos agentes: cada um aparece fazendo o que está fazendo de verdade.">
<link rel="icon" type="image/png" href="/icone/prospector.png">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/sala.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<!-- prévia do link (WhatsApp, Instagram, LinkedIn, X): imagem em public/og.jpg, fonte em docs/producao/og/ -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Prospector">
<meta property="og:title" content="Prospector · Escritório Virtual 3D">
<meta property="og:description" content="Sua equipe de agentes de IA prospectando sozinha: acham empresas, auditam o site e escrevem a abordagem — num escritório 3D que você assiste trabalhar.">
<meta property="og:url" content="https://escritoriovirtual3d.netlify.app/sala.html">
<meta property="og:image" content="https://escritoriovirtual3d.netlify.app/og.jpg">
<meta property="og:image:secure_url" content="https://escritoriovirtual3d.netlify.app/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Prospector: sua equipe de IA prospectando sozinha num escritório virtual 3D">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Prospector · Escritório Virtual 3D">
<meta name="twitter:description" content="Sua equipe de agentes de IA prospectando sozinha: acham empresas, auditam o site e escrevem a abordagem — num escritório 3D que você assiste trabalhar.">
<meta name="twitter:image" content="https://escritoriovirtual3d.netlify.app/og.jpg">
</head>
<body>
<div class="app">
  <aside class="lateral" id="lateral" aria-label="Navegação e equipe"></aside>

  <main class="principal sala">
    <header class="cabecalho">
      <button class="btn icone fantasma abrir-menu" data-abrir-menu aria-label="Abrir menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <div class="titulo"><h1>Sala 3D</h1><p id="chips" class="saude">Montando o escritório…</p></div>
      <div class="acoes">
        <button class="btn" id="btn-textos" aria-pressed="false" title="Esconde os nomes sobre os agentes e a lista de eventos, para ver só o ambiente">Ocultar textos</button>
        <button class="btn" id="btn-tv" aria-expanded="false" aria-controls="tv-painel" title="TV ao vivo na sala de reunião">TV</button>
        <button class="btn" id="btn-som" aria-pressed="false" title="Digitação e envelopes, gerados no navegador">Som desligado</button>
        <button class="btn" id="btn-pausa">Pausar agentes</button>
      </div>
    </header>

    <div class="palco">
      <div id="cena" class="cena" aria-label="Escritório 3D dos agentes. A mesma informação está na barra lateral e no Painel."></div>
      <p class="carregando" id="carregando" role="status">Carregando personagens…</p>
      <nav class="vistas" id="vistas" aria-label="Pontos de vista da câmera"></nav>
      <aside class="tv-painel" id="tv-painel" hidden aria-label="TV ao vivo"></aside>
      <p class="dica" id="dica">Arraste para andar · botão direito gira · role para aproximar onde o mouse aponta · WASD/setas · clique em um agente</p>
      <p class="sem-webgl" id="sem-webgl" hidden>O navegador não abriu o WebGL. A barra lateral e o <a href="/">Painel</a> mostram as mesmas informações.</p>
      <aside class="ficha-agente" id="ficha" hidden aria-live="polite">
        <button class="btn icone fantasma fechar" id="fechar-ficha" aria-label="Fechar"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div id="ficha-conteudo"></div>
      </aside>
      <ol class="trilha" id="trilha" aria-label="Últimos eventos"></ol>
    </div>
  </main>
</div>
<script type="module" src="/sala.js"></script>
</body>
</html>
