<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2º andar · Deck do Etbaal · Prospector</title>
<meta name="description" content="Lanhouse cyberpunk do 2º andar: o Etbaal audita a segurança dos sites dos leads e cada tela mostra uma auditoria real.">
<link rel="icon" type="image/png" href="/icone/prospector.png">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/sala.css">
<link rel="stylesheet" href="/andar2.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app">
  <aside class="lateral" id="lateral" aria-label="Navegação e equipe"></aside>
  <main class="principal sala andar2">
    <header class="cabecalho">
      <button class="btn icone fantasma abrir-menu" data-abrir-menu aria-label="Abrir menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <div class="titulo"><h1>2º andar · Deck do Etbaal</h1><p id="chips" class="saude">Ligando o deck…</p></div>
      <div class="acoes">
        <a class="btn" href="/sala.html" title="Desce para o Paraíso Artificial">↓ Paraíso</a>
        <button class="btn primario" id="btn-auditar" title="O Etbaal audita, sem atacar, os próximos 10 sites próprios ainda não auditados">Auditar próximos 10</button>
      </div>
    </header>
    <div class="palco">
      <div id="cena" class="cena" aria-label="Lanhouse cyberpunk do 2º andar. As mesmas auditorias estão na lista ao lado."></div>
      <p class="carregando" id="carregando" role="status">Ligando os computadores…</p>
      <p class="dica" id="dica">Arraste para girar · role para aproximar · clique numa tela para ver a auditoria</p>
      <p class="sem-webgl" id="sem-webgl" hidden>O navegador não abriu o WebGL. A lista ao lado mostra as mesmas auditorias.</p>
      <aside class="painel-etbaal" id="painel" aria-label="Auditorias do Etbaal" aria-live="polite"></aside>
    </div>
  </main>
</div>
<script type="module" src="/andar2.js"></script>
</body>
</html>
