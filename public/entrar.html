<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Entrar · Prospector</title>
<link rel="icon" type="image/png" href="/icone/prospector.png">
<link rel="stylesheet" href="/ui/base.css">
<style>
  /* LoginPanel (MANUS.AI.WEBSITES.3D.md): transição, validação e estado de erro */
  main { min-height: 100dvh; display: grid; place-items: center; padding: var(--esp-4); }
  .painel-entrar { width: min(380px, 100%); display: grid; gap: var(--esp-5); padding: var(--esp-8) var(--esp-6); background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-bloco); box-shadow: var(--sombra-elevada); }
  @media (prefers-reduced-motion: no-preference) { .painel-entrar { animation: chegar 520ms var(--curva-saida) both; } .painel-entrar.erro { animation: tremer 320ms var(--curva-saida); } }
  @keyframes chegar { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  @keyframes tremer { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .marca-entrar { display: flex; align-items: center; gap: var(--esp-3); }
  .marca-entrar span { width: 44px; height: 44px; border-radius: 12px; background: var(--acento); color: var(--sobre-acento); display: grid; place-items: center; font: 700 var(--t-20)/1 var(--fonte-titulo); }
  h1 { margin: 0; font-size: var(--t-24); }
  .marca-entrar p, .ajuda { margin: 0; color: var(--texto-3); font-size: var(--t-13); }
  .campo-senha { position: relative; }
  .campo-senha input { min-height: 48px !important; font-size: 16px; padding-right: 52px !important; font-family: var(--fonte-mono); letter-spacing: .04em; }
  .campo-senha .ver { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
  .painel-entrar.erro input { border-color: var(--perigo) !important; }
  button[type=submit] { min-height: 48px; font-size: var(--t-16); }
  .erro-msg { color: var(--perigo); font-size: var(--t-13); min-height: 1.4em; margin: calc(var(--esp-3) * -1) 0 0; }
</style>
<!-- prévia do link (WhatsApp, Instagram, LinkedIn, X): imagem em public/og.jpg, fonte em docs/producao/og/ -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Prospector">
<meta property="og:title" content="Prospector · Escritório Virtual 3D">
<meta property="og:description" content="Sua equipe de agentes de IA prospectando sozinha: acham empresas, auditam o site e escrevem a abordagem — num escritório 3D que você assiste trabalhar.">
<meta property="og:url" content="https://escritoriovirtual3d.netlify.app/entrar.html">
<meta property="og:image" content="https://escritoriovirtual3d.netlify.app/og.jpg">
<meta property="og:image:secure_url" content="https://escritoriovirtual3d.netlify.app/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Prospector: sua equipe de IA prospectando sozinha num escritório virtual 3D">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Prospector · Escritório Virtual 3D">
<meta name="twitter:description" content="Sua equipe de agentes de IA prospectando sozinha: acham empresas, auditam o site e escrevem a abordagem — num escritório 3D que você assiste trabalhar.">
<meta name="twitter:image" content="https://escritoriovirtual3d.netlify.app/og.jpg">
</head>
<body>
<main>
  <form class="painel-entrar" id="f" novalidate>
    <div class="marca-entrar"><span>P.</span><div><h1>Prospector</h1><p>Acesso remoto ao seu painel</p></div></div>
    <label class="campo">Senha
      <span class="campo-senha">
        <input id="senha" type="password" autocomplete="current-password" required autofocus aria-describedby="erro ajuda" spellcheck="false" autocapitalize="off">
        <button type="button" class="btn icone fantasma ver" id="ver" aria-label="Mostrar a senha" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </span>
    </label>
    <p class="erro-msg" id="erro" role="alert"></p>
    <button class="btn primario" type="submit">Entrar</button>
    <p class="ajuda" id="ajuda">A senha está no arquivo .env do Prospector, no seu PC (ACESSO_SENHA). Depois de entrar, este aparelho fica conectado por 7 dias.</p>
  </form>
</main>
<script>
  const f = document.querySelector('#f'), erro = document.querySelector('#erro'), btn = f.querySelector('[type=submit]'), senha = document.querySelector('#senha');
  document.querySelector('#ver').addEventListener('click', (e) => {
    const mostrar = senha.type === 'password';
    senha.type = mostrar ? 'text' : 'password';
    e.currentTarget.setAttribute('aria-pressed', String(mostrar));
    e.currentTarget.setAttribute('aria-label', mostrar ? 'Esconder a senha' : 'Mostrar a senha');
    senha.focus();
  });
  senha.addEventListener('input', () => { erro.textContent = ''; f.classList.remove('erro'); });
  const falhar = (msg) => { erro.textContent = msg; f.classList.remove('erro'); void f.offsetWidth; f.classList.add('erro'); senha.select(); };
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!senha.value.trim()) return falhar('Digite a senha.');
    btn.setAttribute('aria-busy', 'true'); btn.disabled = true;
    try {
      const r = await fetch('/api/entrar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha: senha.value.trim() }) });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        return falhar(r.status === 429 ? 'Muitas tentativas erradas. Espere 10 minutos e tente de novo.' : r.status === 401 ? 'Senha incorreta. Confira hífens e letras minúsculas.' : j.erro || 'Não deu para entrar.');
      }
      btn.textContent = 'Entrando…';
      const volta = new URLSearchParams(location.search).get('volta') || '/';
      location.href = volta.startsWith('/') && !volta.startsWith('//') ? volta : '/';
    } catch { falhar('Sem conexão com o PC. Ele está ligado e com o túnel aberto?'); }
    finally { btn.removeAttribute('aria-busy'); btn.disabled = false; }
  });
</script>
</body>
</html>
